name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    outputs:
      unixlike: ${{ steps.scopes.outputs.unixlike }}
      windows: ${{ steps.scopes.outputs.windows }}
      repository: ${{ steps.scopes.outputs.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scopes
        name: Resolve owning scopes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$PR_BASE
          else
            base=$PUSH_BASE
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          scopes=$(tool/version-control/classify --range "$base" "$GITHUB_SHA")
          printf '%s\n' "$scopes"
          if grep -qx unclassified <<<"$scopes"; then
            echo "A changed path has no owning scope." >&2
            exit 1
          fi
          for scope in unixlike windows repository; do
            if grep -qx "$scope" <<<"$scopes"; then
              echo "$scope=true" >>"$GITHUB_OUTPUT"
            else
              echo "$scope=false" >>"$GITHUB_OUTPUT"
            fi
          done

  repository:
    name: Version-control policy
    needs: classify
    if: needs.classify.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # audit reasons about dev and master history, which a shallow
          # checkout does not carry.
          fetch-depth: 0
      - run: tool/version-control/test
      - run: tool/version-control/audit

  unix:
    name: Flake and Unix-like hosts
    needs: classify
    if: needs.classify.outputs.unixlike == 'true'
    runs-on: ubuntu-latest
    # The merge gate is the one place where a check that could not run must not
    # pass. Locally the same checks report unverified and let the push through.
    env:
      REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: tool/checks/format
      - run: tool/checks/lint
      - run: tool/checks/payloads-test
      - run: tool/checks/prerequisite-test
      - run: tool/checks/test

  windows:
    name: Windows desired state
    needs: classify
    if: needs.classify.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      REQUIRE_NATIVE: "1"
      # The Pester suite's end-to-end capture cases each launch a child
      # PowerShell, so .githooks/pre-push leaves them out to keep a local push
      # quick. This is the merge gate, where nothing is left out.
      WIN_ENV_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Validate desired state and test PowerShell
        shell: pwsh
        run: |
          .\windows\tools\setup-dev.ps1
          winget install --id Zellij.Zellij --exact --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath;$env:Path"
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw "$($_.FullName): $($errors[0].Message)" }
          }
          # These report through their exit status rather than by throwing, so
          # the status has to be read. Without this the block would run on past
          # a failed desired-state check and the step would take its result
          # from whatever ran last.
          .\windows\tools\check-desired-state.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\windows\tools\test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The job key stays `secrets`: the required-checks gate, its SECRETS_RESULT
  # input, and the `needs:` list below all key off it. Only the display name
  # widens, because the job carries the three repository-wide scans.
  secrets:
    name: Secret, hygiene and invariant scan
    runs-on: ubuntu-latest
    # The merge gate is the one place where a check that could not run must not
    # pass. tool/version-control/hygiene and tool/version-control/invariants
    # need nothing but a POSIX shell, awk and Git today; this is what keeps a
    # future prerequisite from passing through the gate unverified.
    env:
      REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" |
            sudo tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact --no-banner
      - run: tool/version-control/hygiene
      - run: tool/version-control/invariants

  promotion:
    name: Promotion policy
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require same-repository dev source
        env:
          PROMOTION_BASE_REF: ${{ github.base_ref }}
          PROMOTION_HEAD_REF: ${{ github.head_ref }}
          PROMOTION_BASE_REPOSITORY: ${{ github.repository }}
          PROMOTION_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: tool/version-control/check-promotion
      - name: Require one promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: tool/version-control/check-promotion-queue

  required:
    name: Required checks
    needs: [classify, repository, unix, windows, secrets, promotion]
    if: always()
    runs-on: ubuntu-latest
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      REPOSITORY_SCOPE: ${{ needs.classify.outputs.repository }}
      REPOSITORY_RESULT: ${{ needs.repository.result }}
      UNIXLIKE_SCOPE: ${{ needs.classify.outputs.unixlike }}
      UNIXLIKE_RESULT: ${{ needs.unix.result }}
      WINDOWS_SCOPE: ${{ needs.classify.outputs.windows }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      SECRETS_RESULT: ${{ needs.secrets.result }}
      PROMOTION_SCOPE: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' }}
      PROMOTION_RESULT: ${{ needs.promotion.result }}
    steps:
      - uses: actions/checkout@v7
      - name: Enforce scoped results
        run: tool/version-control/required-checks
