name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Reviewed full current master SHA'
        required: true
        type: string
      head:
        description: 'Reviewed full candidate SHA already available in this repository'
        required: true
        type: string
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.head || github.sha }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    outputs:
      unixlike: ${{ steps.scopes.outputs.unixlike }}
      windows: ${{ steps.scopes.outputs.windows }}
      repository: ${{ steps.scopes.outputs.repository }}
      unixlike_checks: ${{ steps.scopes.outputs.unixlike_checks }}
      windows_checks: ${{ steps.scopes.outputs.windows_checks }}
      repository_checks: ${{ steps.scopes.outputs.repository_checks }}
      base: ${{ steps.scopes.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: scopes
        name: Resolve owning scopes and CI effects
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          PR_STACK: ${{ toJSON(github.event.pull_request.stack) }}
          PUSH_BASE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
          DISPATCH_HEAD: ${{ inputs.head }}
          DISPATCH_REF: ${{ github.ref }}
          CI_HEAD: ${{ inputs.head || github.sha }}
        run: |
          base=$(tool/dispatch/ci-base)
          echo "base=$base" >>"$GITHUB_OUTPUT"
          scopes=$(tool/version-control/classify --range "$base" "$CI_HEAD")
          printf '%s\n' "$scopes"
          if grep -qx unclassified <<<"$scopes"; then
            echo "A changed path has no owning scope." >&2
            exit 1
          fi
          for scope in unixlike windows repository; do
            if grep -qx "$scope" <<<"$scopes"; then
              echo "$scope=true" >>"$GITHUB_OUTPUT"
            else
              echo "$scope=false" >>"$GITHUB_OUTPUT"
            fi
          done
          git diff --name-status "$base" "$CI_HEAD" >"$RUNNER_TEMP/ci-changes"
          units=$(tool/dispatch/select ci <"$RUNNER_TEMP/ci-changes")
          printf 'Selected CI units:\n%s\n' "$units"
          while IFS= read -r unit; do
            case "$unit" in
              ''|repository:fixtures|unixlike:suite|windows:suite|windows:runtime) ;;
              *) echo "Unknown CI unit: $unit" >&2; exit 1 ;;
            esac
          done <<<"$units"
          for scope in unixlike windows repository; do
            if grep -q "^$scope:" <<<"$units"; then
              echo "${scope}_checks=true" >>"$GITHUB_OUTPUT"
            else
              echo "${scope}_checks=false" >>"$GITHUB_OUTPUT"
            fi
          done

  repository:
    name: Version-control policy (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.repository_checks == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The merge gate is the one place where a check that could not run must not
    # pass.
    env:
      REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: tool/version-control/test
        if: runner.os == 'Linux'
      - name: Retired capture guard on native Git for Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          CONFIGS_CONTROLLER_PYTHON: python
        run: tool/version-control/test-retired-capture

  unix:
    name: Unix-like provider contract
    needs: classify
    if: needs.classify.outputs.unixlike_checks == 'true'
    runs-on: ubuntu-latest
    # The merge gate is the one place where a check that could not run must not
    # pass. Locally the same checks report unverified and let the push through.
    env:
      REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.10.6
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify upstream Nix baseline
        shell: bash
        run: |
          actual=$(nix --version)
          printf 'Unix-like CI Nix implementation/version: %s\n' "$actual"
          test "$actual" = 'nix (Nix) 2.34.8'
      - run: unixlike/tool/checks/format
      - run: unixlike/tool/checks/lint
      - run: unixlike/tool/checks/test

  windows:
    name: Windows desired state
    needs: classify
    if: needs.classify.outputs.windows_checks == 'true'
    runs-on: windows-latest
    env:
      REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      # INV repository/windows-ci-runtime-bound: hosted pwsh only acquires the
      # Windows-owned exact artifact; management runs its explicit executable.
      - name: Acquire declared Windows management runtime
        id: runtime
        shell: pwsh
        run: |
          & .\.github\scripts\prepare-windows-ci-runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native runtimes and run Windows management checks
        shell: pwsh
        env:
          CONFIGS_CI_PWSH: ${{ steps.runtime.outputs.pwsh }}
        run: |
          & $env:CONFIGS_CI_PWSH -NoLogo -NoProfile -NonInteractive -File .\.github\scripts\windows-ci.ps1 -RuntimePath $env:CONFIGS_CI_PWSH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The job key stays `secrets`: the required-checks gate, its SECRETS_RESULT
  # input, and the `needs:` list below all key off it. Only the display name
  # widens, because the job carries the seven repository-wide scans.
  secrets:
    name: Secret, hygiene, domain-read, design-citation, invariant, provisional and history scan
    # Only for the classifier's scope outputs: the provisional check fails an
    # overdue entry solely in a scope this change touches.
    needs: classify
    runs-on: ubuntu-latest
    # The merge gate is the one place where a check that could not run must not
    # pass. tool/version-control/hygiene, tool/version-control/invariants and
    # tool/version-control/provisional need nothing but a POSIX shell, awk and
    # Git today, as do tool/version-control/domain-reads,
    # tool/version-control/design-citations and tool/version-control/records;
    # this is what keeps a future
    # prerequisite from passing through the gate unverified.
    env:
      REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" |
            sudo tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact --no-banner
      - run: tool/version-control/hygiene
      - run: tool/version-control/domain-reads
      - run: tool/version-control/design-citations
      - run: tool/version-control/records
      # The range is the one the classify job reads, so a criterion rewritten
      # anywhere in a pull request or a push is judged against the spec its
      # base carried. HEAD is the commit under test: on a pull request the
      # merge GitHub would make.
      - name: Check the work items
        shell: bash
        env:
          CI_BASE: ${{ needs.classify.outputs.base }}
        run: tool/version-control/work --range "$CI_BASE" HEAD
      # Optional topic PRs check incoming messages; push history audit also
      # applies commit-message checks to direct master commits.
      - name: Refuse closing keywords in the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: tool/version-control/closing-keywords --range "$PR_BASE" "$PR_HEAD" --base-ref "$BASE_REF"
      - run: tool/version-control/invariants
      # An overdue entry fails only the scopes this change owns, so the scope
      # list comes from the classify job rather than from this one.
      #
      # A pull request is checked out as a synthetic merge commit whose date is
      # the run time, so the reference date is the head commit's; a push has no
      # head sha and github.sha is the commit itself. Reading the date from the
      # commit under test is what makes a re-run of an old commit answer the
      # same way twice.
      - id: provisional
        name: Resolve the provisional scopes and reference date
        env:
          UNIXLIKE: ${{ needs.classify.outputs.unixlike }}
          WINDOWS: ${{ needs.classify.outputs.windows }}
          REPOSITORY: ${{ needs.classify.outputs.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ inputs.head || github.sha }}
        run: |
          scopes=
          for scope in unixlike windows repository; do
            case $scope in
              unixlike) selected=$UNIXLIKE ;;
              windows) selected=$WINDOWS ;;
              repository) selected=$REPOSITORY ;;
            esac
            [ "$selected" = true ] || continue
            scopes=${scopes:+$scopes,}$scope
          done
          echo "scopes=$scopes" >>"$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cs "${HEAD_SHA:-$PUSH_SHA}")" >>"$GITHUB_OUTPUT"
      - name: Check the provisional registry
        env:
          SCOPES: ${{ steps.provisional.outputs.scopes }}
          REFERENCE_DATE: ${{ steps.provisional.outputs.date }}
        run: tool/version-control/provisional --scopes "$SCOPES" --date "$REFERENCE_DATE"
      # The clone-local half of the audit has nothing to say about a runner,
      # which configures no hooks and checks out no branch; history is what a
      # merge gate can and must judge. Unconditional because a badly named
      # branch or a non-conventional subject is a property of the push, not of
      # a scope, and needs the fetch-depth: 0 checkout this job already takes.
      # HEAD is the commit under test: on a pull request the merge GitHub would
      # make, whose own commits master does not yet contain, so their subjects are
      # judged before the pull request merges (INV repository/conventional-subject).
      - run: tool/version-control/audit --history HEAD
      - name: Audit incoming source ownership
        env:
          CI_BASE: ${{ needs.classify.outputs.base }}
        run: tool/version-control/audit --range "$CI_BASE" HEAD

  topic:
    name: Topic source policy
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    # The merge gate is the one place where a check that could not run must not
    # pass.
    env:
      REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require a same-repository topic or bounded Unix-like input patch
        env:
          TOPIC_BASE_REF: ${{ github.base_ref }}
          TOPIC_HEAD_REF: ${{ github.head_ref }}
          TOPIC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TOPIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOPIC_BASE_REPOSITORY: ${{ github.repository }}
          TOPIC_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: tool/version-control/topic-source
      # The body is read from the pull request as it stands when the job runs,
      # not from the event that started it, so a re-run judges an edited body.
      - name: Refuse closing keywords in the topic body
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC_REPOSITORY: ${{ github.repository }}
          TOPIC_PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$TOPIC_PULL_NUMBER" --repo "$TOPIC_REPOSITORY" --json body --jq .body >"$RUNNER_TEMP/promotion-body"
          tool/version-control/closing-keywords --text "$RUNNER_TEMP/promotion-body"

  required:
    name: Required checks
    needs: [classify, repository, unix, windows, secrets, topic]
    if: always()
    runs-on: ubuntu-latest
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      REPOSITORY_SCOPE: ${{ needs.classify.outputs.repository_checks }}
      REPOSITORY_RESULT: ${{ needs.repository.result }}
      UNIXLIKE_SCOPE: ${{ needs.classify.outputs.unixlike_checks }}
      UNIXLIKE_RESULT: ${{ needs.unix.result }}
      WINDOWS_SCOPE: ${{ needs.classify.outputs.windows_checks }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      SECRETS_RESULT: ${{ needs.secrets.result }}
      TOPIC_SCOPE: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' }}
      TOPIC_RESULT: ${{ needs.topic.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - name: Enforce scoped results
        run: tool/version-control/required-checks
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: accepted-tools
          persist-credentials: false
      - name: Record the tested source
        if: success()
        env:
          CI_BASE: ${{ needs.classify.outputs.base }}
        run: python3 accepted-tools/.github/scripts/ci-source.py
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ci-source
          path: ${{ runner.temp }}/source.json
          retention-days: 90
