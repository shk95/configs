name: Scheduled domain release

on:
  schedule:
    - cron: '0 20,21,22 * * *' # 05 refresh, 06 promotion opens, 07 wait cutoff Asia/Seoul
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional original promotion SHA for exception recovery (requires review)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

env:
  CONFIGS_RELEASE_ENABLED: ${{ vars.CONFIGS_RELEASE_ENABLED }}
  CONFIGS_RELEASE_BOOTSTRAP_SOURCE: ${{ vars.CONFIGS_RELEASE_BOOTSTRAP_SOURCE }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  prepare:
    if: github.event_name != 'schedule' || vars.CONFIGS_RELEASE_SCHEDULE_ENABLED == '1'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.plan.outputs.action }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      approval: ${{ steps.plan.outputs.approval }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$RECOVERY_SOURCE" ]; then
            tool/configs release inspect --source "$RECOVERY_SOURCE" >"$RUNNER_TEMP/plan.json"
          else
            tool/configs release inspect >"$RUNNER_TEMP/plan.json"
          fi
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          plan = json.loads(Path(os.environ['RUNNER_TEMP'], 'plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('action', 'base', 'head', 'approval'):
                  output.write(f'{key}={str(plan.get(key, "")).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Candidate selected from accepted master tooling:\n```json\n' + json.dumps(plan, indent=2) + '\n```\n')
          PY
      - name: Show source-owned versions before approval
        if: steps.plan.outputs.head != ''
        env:
          SOURCE: ${{ steps.plan.outputs.head }}
        run: |
          for domain in unixlike windows; do
            echo "### $domain" >>"$GITHUB_STEP_SUMMARY"
            git show "$SOURCE:$domain/release.json" >>"$GITHUB_STEP_SUMMARY"
          done

  refresh:
    needs: prepare
    if: needs.prepare.outputs.action == 'refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.10.6
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: 'experimental-features = nix-command flakes'
      - name: Refresh permitted inputs without writer credentials
        run: unixlike/tool/refresh-inputs --input nixpkgs --input home-manager --input nix-darwin --input nixos-wsl
      - uses: actions/upload-artifact@v7
        with:
          name: refreshed-lock
          path: unixlike/flake.lock
          retention-days: 1

  refresh-writer:
    needs: [prepare, refresh]
    if: needs.prepare.outputs.action == 'refresh'
    runs-on: ubuntu-latest
    environment: release-control
    concurrency:
      group: configs-release-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: refreshed-lock
          path: ${{ runner.temp }}/refreshed
      - uses: actions/create-github-app-token@v3
        id: app
        if: vars.CONFIGS_RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.CONFIGS_RELEASE_APP_ID }}
          private-key: ${{ secrets.CONFIGS_RELEASE_APP_PRIVATE_KEY }}
      - name: Validate data and publish refresh PR using accepted tooling
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.CONFIGS_RELEASE_TOKEN }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: tool/configs release refresh-pr --base "$BASE" --lock "$RUNNER_TEMP/refreshed/flake.lock"

  approval:
    name: Approve ${{ needs.prepare.outputs.head }} on ${{ needs.prepare.outputs.base }}
    needs: prepare
    if: needs.prepare.outputs.approval == 'true'
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - name: Approved candidate
        env:
          HEAD: ${{ needs.prepare.outputs.head }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: printf 'Approved source %s against base %s\n' "$HEAD" "$BASE"

  writer:
    needs: [prepare, approval]
    if: always() && needs.prepare.result == 'success' && (needs.approval.result == 'success' || needs.prepare.outputs.approval == 'false') && contains(fromJSON('["promote", "refresh-merge", "promotion-pr", "publish", "recover"]'), needs.prepare.outputs.action)
    runs-on: ubuntu-latest
    environment: release-control
    concurrency:
      group: configs-release-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app
        if: vars.CONFIGS_RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.CONFIGS_RELEASE_APP_ID }}
          private-key: ${{ secrets.CONFIGS_RELEASE_APP_PRIVATE_KEY }}
      - name: Recheck candidate, perform bounded write and confirm remote result
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.CONFIGS_RELEASE_TOKEN }}
          HEAD: ${{ needs.prepare.outputs.head }}
          BASE: ${{ needs.prepare.outputs.base }}
          ACTION: ${{ needs.prepare.outputs.action }}
          APPROVED: ${{ needs.approval.result == 'success' }}
        run: |
          if [ "$ACTION" = recover ]; then
            tool/configs release publish --source "$HEAD" --approved
          elif [ "$APPROVED" = true ]; then
            tool/configs release advance --head "$HEAD" --base "$BASE" --approved
          else
            tool/configs release advance --head "$HEAD" --base "$BASE"
          fi
