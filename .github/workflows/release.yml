name: Unix-like input patch

on:
  schedule:
    - cron: '0 20 * * *' # 05:00 Asia/Seoul
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: 'Original input patch merge SHA for publication recovery only'
        required: false
        type: string
  workflow_call:
    inputs:
      manual:
        type: boolean
        default: false


permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

env:
  CONFIGS_RELEASE_ENABLED: ${{ vars.CONFIGS_RELEASE_ENABLED }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  prepare:
    if: github.event_name != 'schedule' || vars.CONFIGS_RELEASE_SCHEDULE_ENABLED == '1'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.plan.outputs.action }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - name: Require master for manual operation
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/master
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SOURCE: ${{ inputs.source }}
          MANUAL: ${{ inputs.manual == true }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$RECOVERY_SOURCE" ]; then
            tool/version-control/release.py inspect --source "$RECOVERY_SOURCE" >"$RUNNER_TEMP/plan.json"
          elif [ "$MANUAL" = true ]; then
            tool/version-control/release.py inspect --manual-start >"$RUNNER_TEMP/plan.json"
          elif [ "$EVENT" = schedule ]; then
            tool/version-control/release.py inspect --scheduled-start >"$RUNNER_TEMP/plan.json"
          else
            tool/version-control/release.py inspect >"$RUNNER_TEMP/plan.json"
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path(os.environ['RUNNER_TEMP'], 'plan.json').read_text())
          if os.environ['MANUAL'] == 'true' and plan['action'] == 'disabled':
              raise SystemExit('Input patch writes are disabled.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('action', 'base', 'head'):
                  output.write(f'{key}={str(plan.get(key, "")).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Candidate selected from accepted master tooling:\n```json\n' + json.dumps(plan, indent=2) + '\n```\n')
          PY

  refresh:
    needs: prepare
    if: needs.prepare.outputs.action == 'refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.10.6
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: 'experimental-features = nix-command flakes'
      - name: Refresh permitted inputs without writer credentials
        run: unixlike/tool/refresh-inputs --input nixpkgs --input home-manager --input nix-darwin --input nixos-wsl
      - uses: actions/upload-artifact@v7
        with:
          name: refreshed-lock
          path: unixlike/flake.lock
          retention-days: 1

  writer:
    needs: [prepare, refresh]
    if: always() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.refresh.result) && (contains(fromJSON('["refresh", "patch-merge", "publish"]'), needs.prepare.outputs.action) || (inputs.manual == true && needs.prepare.outputs.action == 'wait'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: release-control
    concurrency:
      group: configs-release-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.action == 'refresh'
        with:
          name: refreshed-lock
          path: ${{ runner.temp }}/refreshed
      - uses: actions/create-github-app-token@v3
        id: app
        if: vars.CONFIGS_RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.CONFIGS_RELEASE_APP_ID }}
          private-key: ${{ secrets.CONFIGS_RELEASE_APP_PRIVATE_KEY }}
      - name: Publish or resume the checked Unix-like input patch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.CONFIGS_RELEASE_TOKEN }}
          BASE: ${{ needs.prepare.outputs.base }}
          HEAD: ${{ needs.prepare.outputs.head }}
          ACTION: ${{ needs.prepare.outputs.action }}
          MANUAL: ${{ inputs.manual == true }}
          RECOVERY_SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$RECOVERY_SOURCE" ]; then
            tool/version-control/release.py publish --source "$RECOVERY_SOURCE"
          else
            if [ "$ACTION" = refresh ]; then
              tool/version-control/release.py refresh-pr --base "$BASE" --lock "$RUNNER_TEMP/refreshed/flake.lock"
            fi
            if [ "$MANUAL" = true ]; then
              tool/version-control/release.py prepare-manual
            elif [ "$ACTION" != refresh ]; then
              tool/version-control/release.py advance --head "$HEAD" --base "$BASE"
            fi
          fi
