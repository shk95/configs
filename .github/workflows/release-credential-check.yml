name: Read-only operating credential qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-operating-credential:
    if: github.repository == 'shk95/configs' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && github.actor_id == '101378576'
    runs-on: ubuntu-latest
    environment: release-control
    timeout-minutes: 5
    concurrency:
      group: release-credential-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only source and credential observations
        env:
          CONFIGS_RELEASE_TOKEN: ${{ secrets.CONFIGS_RELEASE_TOKEN }}
          CONFIGS_RELEASE_OPERATING_REPOSITORY: ${{ secrets.CONFIGS_RELEASE_OPERATING_REPOSITORY }}
          CONFIGS_RELEASE_OPERATING_REPOSITORY_ID: ${{ secrets.CONFIGS_RELEASE_OPERATING_REPOSITORY_ID }}
        run: python3 -I -S -B tool/version-control/release-credential-check.py
