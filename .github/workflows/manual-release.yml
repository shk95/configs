name: Manual Unix-like input patch

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: configs-manual-release
  cancel-in-progress: false

jobs:
  patch:
    uses: ./.github/workflows/release.yml
    with:
      manual: true
    secrets: inherit
