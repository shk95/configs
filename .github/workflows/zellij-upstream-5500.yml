# PROV unixlike/zellij-combining-marks
# Keep this filename: the provisional registry refers to it. #5500 was closed
# in favour of #5714. Watch the nixpkgs input's moving branch until its Zellij
# source contains #5714, then open one issue and disable this disposable watch.
# A release or an alert alone does not retire the overlay or update the lock.
name: zellij upstream 5714 in nixpkgs

on:
  schedule:
    - cron: "0 0 */5 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issue and self-disable instead of performing them
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: zellij-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch Zellij grapheme support in the nixpkgs input branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Check Zellij source ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          fix=519a23715c6b0f65a3ffada64e738ed6ec9380fc
          workflow=zellij-upstream-5500.yml

          # Evaluate the declared input, not the lock's pinned revision. Nix
          # resolves its current branch once; all later reads use that SHA.
          # No lock writes, package builds or host activation occur here.
          metadata=$(nix flake metadata --json --no-write-lock-file ./unixlike)
          node=$(jq -er '.locks.nodes.root.inputs.nixpkgs | select(type == "string")' <<<"$metadata")
          input=$(jq -ec --arg node "$node" '.locks.nodes[$node]' <<<"$metadata")
          jq -e '.original.type == "github" and (.original.ref | type == "string") and (.original.rev == null)' <<<"$input" >/dev/null
          owner=$(jq -er '.original.owner' <<<"$input")
          repo=$(jq -er '.original.repo' <<<"$input")
          branch=$(jq -er '.original.ref' <<<"$input")
          # metadata retains the existing lock when it is valid; resolve the
          # branch explicitly rather than treating that locked SHA as current.
          revision=$(gh api "repos/$owner/$repo/commits/$(jq -rn --arg ref "$branch" '$ref | @uri')" --jq .sha)
          package=$(nix eval --json "github:$owner/$repo/$revision#legacyPackages.x86_64-linux.zellij-unwrapped" \
            --apply 'p: { version = p.version; rev = p.src.rev; }')
          version=$(jq -er '.version' <<<"$package")
          source=$(jq -er '.rev' <<<"$package")
          # Resolve annotated tags as well as branch/commit source revisions.
          source_sha=$(gh api "repos/zellij-org/zellij/commits/$(jq -rn --arg ref "$source" '$ref | @uri')" --jq .sha)
          status=$(gh api "repos/zellij-org/zellij/compare/$fix...$source_sha" --jq .status)
          echo "$owner/$repo $branch at $revision: Zellij $version ($source -> $source_sha), ancestry=$status"
          case "$status" in
            ahead|identical) ;;
            behind|diverged) echo 'The nixpkgs input branch does not contain #5714 yet.'; exit 0 ;;
            *) echo "Unexpected comparison status: $status" >&2; exit 1 ;;
          esac

          title='unixlike: nixpkgs input includes zellij #5714; retire the combining-mark overlay'
          existing=$(gh issue list --repo "$REPO" --state all \
            --search 'in:title "nixpkgs input includes zellij #5714"' --json number --jq length)
          body=$(cat <<BODY
          The branch tracked by the nixpkgs input now packages a Zellij source containing the #5714 grapheme cluster fix.

          - Input: $owner/$repo, branch $branch, revision $revision
          - Zellij: $version, source $source ($source_sha)
          - Ancestry proof: https://github.com/zellij-org/zellij/compare/$fix...$source_sha
          - Replacement fix: https://github.com/zellij-org/zellij/pull/5714

          This is adoption availability, not proof that flake.lock or any host has changed.

          Refresh the lock and retire the overlay together as described in docs/provisional/unixlike/zellij-combining-marks.md and docs/policy/decisions/unixlike/zellij-patched-on-darwin-until-upstream.md. Preserve the separate lock-only commit; its intentionally failing patch check must not be published alone. Remove the overlay, its checks, this workflow and the registered disposable references in the retirement change. Verify the Darwin build and Hangul rendering/readback separately; activation requires an explicit request.

          Opened by .github/workflows/zellij-upstream-5500.yml. The watch disables itself after this notification.
          BODY
          )
          if [[ "$existing" == 0 ]]; then
            if [[ "$DRY_RUN" == 1 ]]; then
              printf 'would create issue: %s\n%s\n' "$title" "$body"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body"
            fi
          else
            echo 'The notification issue already exists (open or closed).'
          fi
          if [[ "$DRY_RUN" == 1 ]]; then
            echo "would disable $workflow"
          else
            gh workflow disable "$workflow" --repo "$REPO"
          fi
